<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>નવા વર્ષની શુભેચ્છાઓ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gujarati:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{--navy:#070b24;--purple:#5b2a86;--pink:#ffb6cf;--white:#fff8f2;--gold:#f5c96a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-snap-type:y mandatory;overflow-y:scroll;scroll-behavior:smooth;background:var(--navy)}
body{font-family:'Noto Serif Gujarati','Noto Sans Gujarati',serif;color:var(--white);background:var(--navy)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
section{position:relative;z-index:1;min-height:100svh;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vh 6vw;gap:2.2vh}
section::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 30%,rgba(91,42,134,.35),transparent 70%)}
h1,h2{font-weight:600;color:var(--gold);text-shadow:0 0 24px rgba(245,201,106,.55);line-height:1.5}
h1{font-size:clamp(2.2rem,7vw,5rem)}
h2{font-size:clamp(1.4rem,3.6vw,2.6rem)}
p{font-size:clamp(1rem,2vw,1.45rem);line-height:2;max-width:46ch}
.big{font-size:clamp(1.6rem,4vw,3rem);color:var(--pink);text-shadow:0 0 20px rgba(255,182,207,.5)}
.rv{opacity:0}
.btn{font:inherit;font-size:clamp(1rem,2vw,1.3rem);color:var(--navy);background:linear-gradient(135deg,var(--gold),var(--pink));border:0;border-radius:99px;padding:.9em 2.2em;cursor:pointer;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 36px 6px rgba(245,201,106,.7)}}
.frame{width:min(78vw,520px);aspect-ratio:4/3;border-radius:18px;border:2px solid var(--gold);box-shadow:0 0 50px rgba(245,201,106,.35);overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.05);font-size:4rem;position:relative}
.frame img,.frame video{width:100%;height:100%;object-fit:cover;display:block}
.frame small{position:absolute;bottom:8px;font-size:.8rem;opacity:.7;font-family:'Noto Sans Gujarati',sans-serif}
.vid{width:min(92vw,820px);aspect-ratio:16/9}
.bouq{font-size:clamp(7rem,22vw,13rem);filter:drop-shadow(0 0 30px rgba(255,182,207,.6));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
.book{width:min(92vw,760px);padding:clamp(1.2rem,4vw,3rem);border-radius:8px 16px 16px 8px;background:linear-gradient(100deg,#f6e7cf,#fff4e0 50%,#f1dfc2);color:#4a2a1a;box-shadow:0 0 0 3px #7a4a2a,0 20px 60px rgba(0,0,0,.6),0 0 60px rgba(245,201,106,.35);text-align:left;max-height:84svh;overflow-y:auto;transform-origin:left center}
.book p{max-width:none;font-size:clamp(.95rem,1.8vw,1.2rem);line-height:2;margin-bottom:1em}
.book p.hl{font-weight:600;color:#8a1f4a}
.lights{position:absolute;top:2vh;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none}
.lights i{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px 5px var(--gold);animation:tw 2s infinite}
.lights i:nth-child(even){animation-delay:1s;background:var(--pink);box-shadow:0 0 14px 5px var(--pink)}
@keyframes tw{50%{opacity:.25}}
.moon{width:clamp(70px,12vw,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#f5e6b8 60%,#d9c07a);box-shadow:0 0 60px 20px rgba(255,240,180,.45)}
.heart{font-size:clamp(3rem,8vw,5rem);animation:beat 1.3s infinite}
@keyframes beat{15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
#mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:10;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:rgba(7,11,36,.6);color:var(--gold);font-size:1.3rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="mute" aria-label="સંગીત ચાલુ/બંધ" title="સંગીત">🔇</button>
<main id="app"></main>
<audio id="bgm" loop preload="none"></audio>
<script>
/* ===== ASSETS: અહીં તમારી ફાઇલોની લિંક મૂકો (image / video / music) ===== */
const ASSETS={shiva:"shivafamily.jpg",bouquet:"bouquet.webp",video:"video.mp4",poster:"",music:""};

/* ===== CONTENT: બધું ગુજરાતી લખાણ અહીં એડિટ કરી શકાય ===== */
const CONTENT={
s1:{om:"ૐ નમઃ શિવાય",msg:"મહાદેવના આશીર્વાદથી તમારા જીવનમાં હંમેશા સુખ, શાંતિ, સમૃદ્ધિ અને ખુશીઓ બની રહે. તમારા દરેક સપના સાકાર થાય અને જીવનનો દરેક દિવસ નવી આશા લઈને આવે.",btn:"ચાલો, એક સુંદર શરૂઆત કરીએ..."},
s2:{intro:"એક નવી સવાર, એક નવું વર્ષ,\nઅને તમારા માટે દિલથી કેટલીક ખાસ લાગણીઓ...",wish:"નવા વર્ષની ખૂબ ખૂબ શુભેચ્છાઓ! ❤️"},
s3:{paras:["આ ફૂલોની જેમ તમારા જીવનમાં પણ\nહંમેશા ખુશીઓ ખીલતી રહે...","દરેક દિવસ તમારા માટે નવી ખુશીઓ લઈને આવે,\nદરેક પળ સુંદર યાદ બની જાય,\nઅને તમારા ચહેરા પરનું સ્મિત\nહંમેશા આવું જ જળવાઈ રહે.","આ નાનકડો ગુલદસ્તો તમારા માટે,\nપણ એની પાછળ છુપાયેલી લાગણી ખૂબ જ ખાસ છે."]},
s4:{paras:["કેટલીક વ્યક્તિઓ આપણા જીવનમાં એવી રીતે આવે છે કે ધીમે ધીમે તેઓ આપણા માટે ખૂબ જ ખાસ બની જાય છે.","તેમની સાથે જોડાયેલી નાની-નાની વાતો પણ દિલની નજીક રહે છે. ક્યારેક તેમની સાથેની એક સામાન્ય વાતચીત પણ આખા દિવસને સુંદર બનાવી દે છે.","*તમે મારા જીવનની એવી જ એક ખાસ વ્યક્તિ છો.","આપણા સંબંધને કયા શબ્દોમાં સમજાવવો એ ખરેખર મારા માટે સરળ નથી. કારણ કે કેટલીક લાગણીઓ એવી હોય છે, જેને શબ્દોમાં વ્યક્ત કરવી શક્ય જ નથી હોતી.","આપણી વચ્ચેનું આ સુંદર જોડાણ, એકબીજા પ્રત્યેનો વિશ્વાસ, લાગણી અને આપણી નાની-નાની યાદો મારા માટે ખૂબ જ કિંમતી છે.","કદાચ હું ક્યારેય તમને કહી ન શકું કે તમે મારા માટે કેટલા ખાસ છો, પરંતુ એટલું ચોક્કસ કહી શકું કે તમારા જીવનમાં હોવાની લાગણી મારા માટે અનમોલ છે.","મારી બસ એટલી જ ઈચ્છા છે કે આપણી વચ્ચેનું આ સુંદર બોન્ડ હંમેશા આવું જ રહે. સમય બદલાય, પરિસ્થિતિઓ બદલાય, પરંતુ આ લાગણી અને એકબીજા પ્રત્યેનો આદર ક્યારેય ઓછો ન થાય.","કેટલાક સંબંધોને કોઈ નામની જરૂર હોતી નથી. તેમની સુંદરતા તેમની લાગણીઓમાં જ હોય છે.","*અને તમે મારા જીવનની એવી જ એક સુંદર લાગણી છો."]},
s5:{head:"એક ખાસ અંદાજમાં, એક ખાસ વ્યક્તિ માટે...",msg:"આ નવા વર્ષની શુભેચ્છાઓ આપવાની રીત થોડી અલગ છે, પરંતુ એની પાછળની લાગણી એકદમ દિલથી છે.\n\nઆ નાની એવી સરપ્રાઇઝ તમારા ચહેરા પર એક સુંદર સ્મિત લાવે, બસ મારી એટલી જ ઈચ્છા છે."},
s6:{paras:["આ નવા વર્ષે મહાદેવને મારી એક જ પ્રાર્થના છે...","તમારા જીવનમાં ક્યારેય ખુશીઓની કમી ન રહે.\nતમારા દરેક સપનાને નવી ઉડાન મળે.\nતમારા દરેક પ્રયત્નમાં સફળતા મળે.\nતમારા ચહેરા પર હંમેશા સ્મિત રહે.\nતમારા દિલને હંમેશા શાંતિ અને સંતોષ મળે.","જીવનમાં ગમે તેવી પરિસ્થિતિ આવે,\nતમને હંમેશા હિંમત અને શક્તિ મળતી રહે.","ભગવાન મહાદેવના આશીર્વાદ\nહંમેશા તમારી સાથે રહે."]},
s7:{paras:["જતાં જતાં બસ એટલું જ કહેવું છે...","તમે મારા માટે માત્ર એક સામાન્ય વ્યક્તિ નથી,\nપરંતુ મારા જીવનની એક ખૂબ જ ખાસ લાગણી છો.","તમારી સાથે જોડાયેલી દરેક સારી યાદ\nમારા માટે હંમેશા કિંમતી રહેશે.","કદાચ મારી લાગણીઓને વ્યક્ત કરવા માટે\nમારી પાસે પૂરતા શબ્દો નથી,\nપણ દિલથી એટલું જરૂર કહેવા માગું છું કે\nતમારી જગ્યા મારા જીવનમાં હંમેશા ખાસ રહેશે.","આપણી વચ્ચેનું આ સુંદર જોડાણ\nહંમેશા આવું જ જળવાઈ રહે.","નવું વર્ષ તમારા માટે\nઅઢળક ખુશીઓ, પ્રેમ, શાંતિ અને સફળતા લઈને આવે.","*નવા વર્ષની દિલથી ખૂબ ખૂબ શુભેચ્છાઓ! ❤️"],end:"હંમેશા તમારા માટે એક ખાસ લાગણી સાથે... ❤️"}
};

/* ===== BUILD ===== */
const C=CONTENT,br=t=>t.replace(/\n/g,"<br>");
const ps=(a,cls="")=>a.map(t=>t[0]=="*"?`<p class="rv hl ${cls}">${br(t.slice(1))}</p>`:`<p class="rv ${cls}">${br(t)}</p>`).join("");
const lights='<div class="lights">'+"<i></i>".repeat(14)+"</div>";
document.getElementById("app").innerHTML=`
<section data-fx="">
 <h1 class="rv">${C.s1.om}</h1>
 <div class="frame rv" id="shivaF">🔱<small>Shiva family image</small></div>
 <p class="rv">${C.s1.msg}</p>
 <button class="btn rv" id="go">${C.s1.btn}</button>
</section>
<section data-fx="fw">
 <h2 class="rv">${br(C.s2.intro)}</h2>
 <div class="big rv">${C.s2.wish}</div>
</section>
<section data-fx="petals">
 <div class="bouq rv" id="bq">💐</div>
 ${ps(C.s3.paras)}
</section>
<section data-fx="petals" data-slow="1">${lights}
 <div class="book rv" id="book">${ps(C.s4.paras,"bp")}</div>
</section>
<section data-fx="">
 <h2 class="rv">${C.s5.head}</h2>
 <div class="frame vid rv" id="vidF"><span>🚗</span><small>Your video here</small></div>
 <p class="rv">${br(C.s5.msg)}</p>
</section>
<section data-fx="fw">
 <div class="moon rv"></div>
 ${ps(C.s6.paras)}
</section>
<section data-fx="fw petals">
 <div class="heart rv">❤️</div>
 ${ps(C.s7.paras)}
 <h2 class="rv">${C.s7.end}</h2>
</section>`;

/* assets */
if(ASSETS.shiva)document.getElementById("shivaF").innerHTML=`<img src="${ASSETS.shiva}" alt="શિવ પરિવાર" loading="eager">`;
if(ASSETS.bouquet)document.getElementById("bq").innerHTML=`<img src="${ASSETS.bouquet}" alt="ગુલદસ્તો" style="max-width:60vw;max-height:36vh">`;
if(ASSETS.video)document.getElementById("vidF").innerHTML=`<video src="${ASSETS.video}" poster="${ASSETS.poster}" controls playsinline preload="metadata" aria-label="ખાસ વિડિયો"></video>`;

/* music */
const bgm=document.getElementById("bgm"),mute=document.getElementById("mute");let on=false;
if(ASSETS.music)bgm.src=ASSETS.music;
function setMusic(v){on=v;mute.textContent=v?"🔊":"🔇";if(ASSETS.music){v?bgm.play().catch(()=>{}):bgm.pause()}}
mute.onclick=()=>setMusic(!on);
document.getElementById("go").onclick=()=>{setMusic(true);document.querySelectorAll("section")[1].scrollIntoView({behavior:"smooth"})};

/* reveals */
const secs=[...document.querySelectorAll("section")];let cur=secs[0];
const io=new IntersectionObserver(es=>es.forEach(e=>{
 if(!e.isIntersecting)return;cur=e.target;
 if(e.target._done)return;e.target._done=1;
 const slow=e.target.dataset.slow;
 gsap.fromTo(e.target.querySelectorAll(".rv"),{opacity:0,y:28},{opacity:1,y:0,duration:1.4,stagger:slow?1.6:1.1,ease:"power2.out",delay:.3});
 const bk=e.target.querySelector("#book");if(bk)gsap.from(bk,{rotationY:-70,duration:1.6,ease:"power3.out",transformPerspective:1200});
}),{threshold:.55});
secs.forEach(s=>io.observe(s));

/* canvas: stars, fireworks, petals */
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let W,H;
const stars=[],sp=[],pt=[],pet=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
for(let i=0;i<110;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.3,p:Math.random()*6});
function boom(x,y){const h=Math.random()*60+(Math.random()<.5?30:320);for(let i=0;i<46;i++){const a=Math.PI*2*i/46,s=Math.random()*3.2+1.2;sp.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h})}}
let last=0,shoot=null;
function loop(t){
 const fx=cur.dataset.fx||"";
 cx.fillStyle="rgba(7,11,36,.28)";cx.fillRect(0,0,W,H);
 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,"rgba(91,42,134,.18)");g.addColorStop(1,"rgba(7,11,36,0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);
 stars.forEach(s=>{cx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));cx.fillStyle="#fff";cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,7);cx.fill()});
 cx.globalAlpha=1;
 if(fx.includes("fw")){
  if(t-last>900){last=t;boom(W*(.15+Math.random()*.7),H*(.12+Math.random()*.4))}
  if(!shoot&&Math.random()<.004)shoot={x:Math.random()*W,y:0,l:1};
 }
 if(shoot){cx.strokeStyle=`rgba(255,255,255,${shoot.l})`;cx.lineWidth=2;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x-60,shoot.y-30);cx.stroke();shoot.x+=14;shoot.y+=7;shoot.l-=.02;if(shoot.l<=0)shoot=null}
 for(let i=sp.length-1;i>=0;i--){const p=sp[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.vx*=.985;p.l-=.013;
  if(p.l<=0){sp.splice(i,1);continue}
  cx.fillStyle=`hsla(${p.h},100%,65%,${p.l})`;cx.shadowBlur=8;cx.shadowColor=`hsl(${p.h},100%,60%)`;cx.beginPath();cx.arc(p.x,p.y,2,0,7);cx.fill()}
 cx.shadowBlur=0;
 if(fx.includes("petals")&&pet.length<26&&Math.random()<.08)pet.push({x:Math.random()*W,y:-10,s:Math.random()*5+4,v:Math.random()+.6,r:Math.random()*6,w:Math.random()*2});
 for(let i=pet.length-1;i>=0;i--){const p=pet[i];p.y+=p.v;p.x+=Math.sin(p.y/50+p.w)*.8;p.r+=.02;
  if(p.y>H+10){pet.splice(i,1);continue}
